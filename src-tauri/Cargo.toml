[package]
name = "lucifer-dashboard"
version = "0.1.0"
description = "Una dashboard desktop personalizzabile"
authors = ["you"]
edition = "2021"

[lib]
name = "lucifer_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23.1"
sysinfo = "0.40.0"
